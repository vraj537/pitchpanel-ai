{% extends 'base_auth.html' %}
{% load static %}
{% block title %}Password Reset | PitchPanel Ai{% endblock %}
{% block content %}
<div class="auth-page py-4 px-3 hero-bg-effect">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-8 col-lg-7 col-xl-6 col-xxl-5">
        <div class="auth-card-wrapper">
          <div class="card auth-card mb-0" id="vaultCard">
            <div class="card-body p-md-5 text-center">
              <div class="avatar avatar-xxl avatar-primary mx-auto rounded-4"><img src="{% static 'images/logo-sm.png' %}" alt="" height="55"></div>
              <p class="text-uppercase fw-bolder ls-3 mt-4">Password Updated</p>
              <p class="text-muted fs-14 mb-4">Your password has been changed successfully. You can now log in.</p>
              <a href="{% url 'accounts:login' %}" class="btn btn btn-soft-light w-100 text-uppercase ls-3 fs-15">Go to Login</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
