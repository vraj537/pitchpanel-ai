{% extends 'base_auth.html' %}
{% load static %}
{% block title %}Create Account | PitchPanel Ai{% endblock %}
{% block content %}
<div class="auth-page py-4 px-3 hero-bg-effect">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-8 col-lg-7 col-xl-6 col-xxl-5">
        <div class="auth-card-wrapper">
          <div class="card auth-card mb-0" id="vaultCard">
            <div class="card-body p-md-5">
              <div class="avatar avatar-xxl avatar-primary mx-auto rounded-4"><img src="{% static 'images/logo-sm.png' %}" alt="" height="55"></div>
              <div class="text-center">
                <p class="text-uppercase fw-bolder ls-3 mt-4">Create Account</p>
                <div class="badge-glass badge bg-soft-primary fs-12 py-2 px-3 text-uppercase rounded-pill mb-4 d-inline-flex align-items-center gap-2 mx-auto" data-aos="fade-up" data-aos-duration="1200">
                  <span class="pulse-dot bg-primary"></span> Join PitchPanel Ai
                </div>
              </div>
              {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
              <form class="my-4 pt-3 auth-form" method="post">
                {% csrf_token %}
                <div class="mb-40">
                  <label for="id_full_name" class="form-label text-uppercase fs-12 ls-3 opacity-50 mb-0">Full Name</label>
                  <input type="text" name="full_name" class="form-control" id="id_full_name" placeholder="Johnathan Doe" required value="{{ form.full_name.value|default:'' }}">
                </div>
                <div class="mb-40">
                  <label for="id_email" class="form-label text-uppercase fs-12 ls-3 opacity-50 mb-0">Email</label>
                  <input type="email" name="email" class="form-control" id="id_email" placeholder="you@example.com" required value="{{ form.email.value|default:'' }}">
                </div>
                <div class="mb-30">
                  <label for="id_password" class="form-label text-uppercase fs-12 ls-3 opacity-50 mb-0">Password</label>
                  <input type="password" name="password" class="form-control" id="id_password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn btn-soft-light w-100 text-uppercase ls-3 fs-15">Create Account <i class="ri-login-circle-line btn-icon-anim ms-2"></i></button>
              </form>
              <p class="text-center text-uppercase fs-12 ls-2 mb-0"><span class="opacity-60">Already Registered?</span> <a href="{% url 'accounts:login' %}" class="ps-1">Log In</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
