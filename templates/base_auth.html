{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}PitchPanel Ai{% endblock %}</title>
{% include 'includes/head_assets.html' %}
</head>
<body>
<canvas id="bg-stars"></canvas>
<div id="bg-blur" aria-hidden="true"></div>
<canvas id="orb-bg"></canvas>
{% block content %}{% endblock %}
{% include 'includes/scripts.html' %}
<script>
const card = document.getElementById('vaultCard');
if (card) {
  document.addEventListener('mousemove', (e) => {
    let xAxis = (window.innerWidth / 2 - e.pageX) / 25;
    let yAxis = (window.innerHeight / 2 - e.pageY) / 25;
    card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
  });
  document.addEventListener('mouseleave', () => {
    card.style.transform = `rotateY(0deg) rotateX(0deg)`;
  });
}
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
